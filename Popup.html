<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BVM</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Space+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #000000;
      --white: #ffffff;
      --dim: #888888;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'Space Mono', monospace;
      overflow: hidden;
      cursor: none;
    }

    /* Custom cursor */
    .cursor {
      position: fixed;
      width: 10px; height: 10px;
      background: white;
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease, width 0.2s ease, height 0.2s ease;
    }
    .cursor.grow { width: 30px; height: 30px; background: transparent; border: 1px solid white; }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      opacity: 0.4;
    }

    /* Scan line effect */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(255,255,255,0.01) 2px,
        rgba(255,255,255,0.01) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    .container {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    /* Top left corner line */
    .corner-tl, .corner-tr, .corner-bl, .corner-br {
      position: fixed;
      width: 40px; height: 40px;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
    }
    .corner-tl { top: 24px; left: 24px; border-top: 1px solid #333; border-left: 1px solid #333; animation-delay: 2s; }
    .corner-tr { top: 24px; right: 24px; border-top: 1px solid #333; border-right: 1px solid #333; animation-delay: 2.2s; }
    .corner-bl { bottom: 24px; left: 24px; border-bottom: 1px solid #333; border-left: 1px solid #333; animation-delay: 2.4s; }
    .corner-br { bottom: 24px; right: 24px; border-bottom: 1px solid #333; border-right: 1px solid #333; animation-delay: 2.6s; }

    /* BVM logo */
    .logo {
      font-family: 'Black Ops One', sans-serif;
      font-size: clamp(80px, 20vw, 180px);
      letter-spacing: 0.15em;
      color: white;
      opacity: 0;
      animation: revealLogo 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.3s;
      line-height: 1;
      position: relative;
    }

    .logo::after {
      content: 'BVM';
      position: absolute;
      inset: 0;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,255,255,0.08);
      transform: translate(3px, 3px);
      z-index: -1;
    }

    @keyframes revealLogo {
      0% { opacity: 0; transform: scaleX(0.8) translateY(20px); filter: blur(20px); }
      100% { opacity: 1; transform: scaleX(1) translateY(0); filter: blur(0); }
    }

    /* Belgisch schrift line */
    .belgisch {
      font-family: 'Space Mono', monospace;
      font-size: clamp(10px, 2vw, 14px);
      letter-spacing: 0.4em;
      color: #333;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 1.2s;
      text-transform: uppercase;
      margin-top: -8px;
      margin-bottom: 60px;
    }

    /* Tagline */
    .tagline {
      font-size: clamp(9px, 1.5vw, 11px);
      letter-spacing: 0.5em;
      color: #444;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 1.6s;
      margin-bottom: 64px;
    }

    /* Device buttons */
    .buttons {
      display: flex;
      gap: 24px;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 2s;
    }

    .btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 28px 40px;
      border: 1px solid #222;
      text-decoration: none;
      color: #666;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      transition: all 0.4s ease;
      background: transparent;
      cursor: none;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: white;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 0;
    }

    .btn:hover::before { transform: translateY(0); }
    .btn:hover { color: black; border-color: white; }
    .btn:hover svg { stroke: black; }

    .btn svg, .btn span { position: relative; z-index: 1; }

    .btn svg {
      width: 32px; height: 32px;
      stroke: #555;
      fill: none;
      stroke-width: 1.5;
      transition: stroke 0.4s ease;
    }

    /* Divider */
    .divider {
      width: 1px;
      height: 80px;
      background: #1a1a1a;
      align-self: center;
    }

    /* Bottom text */
    .bottom {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: 0.4em;
      color: #222;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 3s;
      white-space: nowrap;
    }

    /* Year indicator */
    .year {
      position: fixed;
      top: 32px;
      right: 80px;
      font-size: 9px;
      letter-spacing: 0.3em;
      color: #222;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 3s;
    }

    /* Belgium flag accent — subtle */
    .flag-accent {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, #1a1a1a 33%, #1a1a1a 33%, #1a1a1a 66%, #1a1a1a 66%);
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 2.8s;
    }

    /* Loading bar */
    .loadbar {
      position: fixed;
      top: 0; left: 0;
      height: 1px;
      background: white;
      width: 0%;
      animation: load 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes load {
      0% { width: 0%; opacity: 1; }
      80% { width: 100%; opacity: 1; }
      100% { width: 100%; opacity: 0; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile responsive */
    @media (max-width: 480px) {
      .buttons { flex-direction: column; gap: 16px; align-items: center; }
      .divider { width: 60px; height: 1px; }
      .btn { padding: 20px 48px; }
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="loadbar"></div>

  <div class="corner-tl"></div>
  <div class="corner-tr"></div>
  <div class="corner-bl"></div>
  <div class="corner-br"></div>
  <div class="flag-accent"></div>

  <div class="year">EST. 2029</div>

  <div class="container">

    <div class="logo">BVM</div>

    <div class="belgisch">&#9135;&#9135; &#9135;&#8212;&#9135; &#9135; &#8739; &#8739;&#8212;&#9135;&#9135;&#9135;</div>

    <div class="tagline">Belgium &nbsp;·&nbsp; 2029 &nbsp;·&nbsp; The future of tomorrow</div>

    <div class="buttons">

      <a href="https://brebendc.github.io/BVM/BVM.html" class="btn" id="pc-btn">
        <svg viewBox="0 0 24 24">
          <rect x="2" y="3" width="20" height="14" rx="1"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <span>Desktop</span>
      </a>

      <div class="divider"></div>

      <a href="https://brebendc.github.io/BVM-GSM/BVM.html" class="btn" id="phone-btn">
        <svg viewBox="0 0 24 24">
          <rect x="7" y="2" width="10" height="20" rx="2"/>
          <circle cx="12" cy="18" r="1" fill="currentColor"/>
        </svg>
        <span>Mobile</span>
      </a>

    </div>
  </div>

  <div class="bottom">Belgische Voertuig Motoriek &nbsp;·&nbsp; © Breben DC 2026</div>

  <script>
    // Custom cursor
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('mouseenter', () => cursor.classList.add('grow'));
      btn.addEventListener('mouseleave', () => cursor.classList.remove('grow'));
    });

    // Auto-detect device and highlight correct button
    const isMobile = /iPhone|Android|iPad|Mobile/i.test(navigator.userAgent);
    if (isMobile) {
      document.getElementById('phone-btn').style.borderColor = '#444';
      document.getElementById('phone-btn').style.color = '#aaa';
    } else {
      document.getElementById('pc-btn').style.borderColor = '#444';
      document.getElementById('pc-btn').style.color = '#aaa';
    }
  </script>
</body>
</html>
